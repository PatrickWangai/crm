databases:
  - name: masterways-crm-db
    plan: free
    databaseName: masterways_crm
    user: masterways_crm

services:
  - type: web
    name: masterways-crm
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: masterways-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      # Shared secret with the standalone customer Help & Support app's
      # server-to-server bridge — must match PUBLIC_API_KEY there exactly.
      - key: PUBLIC_API_KEY
        value: 7ff32f1144d2c129a717f4c33919b46dded463dd5a4e17ed12bc8402683f80f9
      # Cloudflare R2 (S3-compatible) document storage. Render's web service
      # filesystem is ephemeral — without these four set, uploaded documents
      # are written to local disk and silently lost on every redeploy. Paste
      # values from the R2 bucket + API token once created (see README).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Resend — sends department-watcher emails (new request / accepted /
      # completed). Without it, those events still fire as in-app
      # notifications only. Get a key at resend.com > API Keys.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: APP_URL
        value: https://masterways-crm.onrender.com
